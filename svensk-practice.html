<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dansk Øvelse</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --red:#C0392B; --cream:#F5F0E8; --dark:#1A1A1A; --mid:#4A4440; --muted:#9A8E85;
    --card-bg:#FEFCF8; --border:#E0D8CC; --correct:#2E7D52; --wrong:#C0392B;
    --srs-new:#3B82F6; --srs-learn:#F59E0B; --srs-due:#C0392B; --srs-ok:#2E7D52;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:'DM Sans',sans-serif; background:var(--cream); color:var(--dark); min-height:100vh; max-width:480px; margin:0 auto; overflow-x:hidden; }
  .header { background:var(--dark); color:var(--cream); padding:18px 20px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
  .header-title { font-family:'Playfair Display',serif; font-size:22px; letter-spacing:-0.5px; }
  .header-title span { color:var(--red); font-style:italic; }
  .header-sub { font-size:10px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; margin-top:1px; }
  .streak-badge { background:var(--red); color:white; font-size:12px; font-weight:500; padding:4px 10px; border-radius:20px; }
  .tabs { display:flex; border-bottom:1px solid var(--border); background:var(--card-bg); position:sticky; top:61px; z-index:99; }
  .tab { flex:1; padding:11px 4px; text-align:center; font-size:11px; font-weight:500; letter-spacing:0.3px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; transition:all 0.2s; user-select:none; }
  .tab.active { color:var(--dark); border-bottom-color:var(--red); }
  .screen { display:none; padding:16px 14px 120px; }
  .screen.active { display:block; }
  .srs-dash { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:18px; }
  .srs-tile { background:var(--card-bg); border:1px solid var(--border); border-radius:10px; padding:10px 6px; text-align:center; }
  .srs-tile-num { font-family:'Playfair Display',serif; font-size:22px; font-weight:700; line-height:1; }
  .srs-tile-label { font-size:10px; color:var(--muted); margin-top:3px; letter-spacing:0.3px; }
  .srs-tile.new .srs-tile-num { color:var(--srs-new); }
  .srs-tile.learning .srs-tile-num { color:var(--srs-learn); }
  .srs-tile.due .srs-tile-num { color:var(--srs-due); }
  .srs-tile.known .srs-tile-num { color:var(--srs-ok); }
  .study-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .study-mode-label { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); }
  .study-count { font-size:12px; color:var(--muted); }
  .srs-card { background:var(--card-bg); border:1px solid var(--border); border-radius:16px; padding:28px 22px; text-align:center; min-height:210px; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 2px 12px rgba(0,0,0,0.06); cursor:pointer; transition:transform 0.1s; position:relative; }
  .srs-card:active { transform:scale(0.99); }
  .card-badge { position:absolute; top:12px; right:14px; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; padding:3px 8px; border-radius:20px; font-weight:600; }
  .badge-new { background:#EFF6FF; color:var(--srs-new); }
  .badge-review { background:#FEF3C7; color:var(--srs-learn); }
  .badge-due { background:#FEF2F2; color:var(--srs-due); }
  .card-label { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
  .card-word { font-family:'Playfair Display',serif; font-size:44px; font-weight:700; color:var(--dark); line-height:1.1; margin-bottom:6px; }
  .card-ipa { font-size:12px; color:var(--muted); font-style:italic; margin-bottom:6px; }
  .card-cat-tag { font-size:10px; background:var(--cream); border:1px solid var(--border); border-radius:10px; padding:2px 8px; color:var(--muted); }
  .tap-hint { font-size:11px; color:var(--muted); margin-top:14px; }
  .card-reveal { display:none; width:100%; border-top:1px solid var(--border); padding-top:16px; margin-top:12px; }
  .card-reveal.shown { display:block; }
  .card-swedish { font-size:12px; color:var(--muted); margin-bottom:5px; }
  .card-swedish strong { color:var(--mid); }
  .card-meaning { font-size:17px; font-weight:500; color:var(--dark); margin-bottom:8px; }
  .card-note { font-size:11px; color:var(--muted); font-style:italic; line-height:1.5; background:var(--cream); border-radius:8px; padding:7px 10px; text-align:left; }
  .card-note strong { color:var(--red); font-style:normal; }
  .audio-btn { width:48px; height:48px; border-radius:50%; background:var(--dark); color:var(--cream); border:none; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; transition:transform 0.1s,background 0.15s; flex-shrink:0; }
  .audio-btn:active { transform:scale(0.92); background:var(--red); }
  .audio-btn.speaking { background:var(--red); animation:pulse 0.6s infinite alternate; }
  @keyframes pulse { from{transform:scale(1);}to{transform:scale(1.06);} }
  .srs-ratings { display:flex; gap:8px; margin-top:14px; }
  .rating-btn { flex:1; padding:13px 4px; border-radius:12px; border:1.5px solid var(--border); background:var(--card-bg); font-family:'DM Sans',sans-serif; font-size:12px; font-weight:600; cursor:pointer; transition:all 0.15s; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .rating-btn:active { transform:scale(0.96); }
  .rating-btn .r-emoji { font-size:18px; }
  .rating-btn .r-label { font-size:10px; letter-spacing:0.3px; }
  .rating-btn .r-interval { font-size:9px; color:var(--muted); }
  .rating-btn.r-again { border-color:#FCA5A5; color:var(--wrong); }
  .rating-btn.r-hard { border-color:#FCD34D; color:#92400E; }
  .rating-btn.r-good { border-color:#86EFAC; color:var(--correct); }
  .rating-btn.r-easy { border-color:#93C5FD; color:#1D4ED8; }
  .rating-btn.r-again:active { background:#FEF2F2; }
  .rating-btn.r-hard:active { background:#FFFBEB; }
  .rating-btn.r-good:active { background:#F0FDF4; }
  .rating-btn.r-easy:active { background:#EFF6FF; }
  .done-panel { text-align:center; padding:40px 16px; }
  .done-emoji { font-size:56px; margin-bottom:14px; }
  .done-title { font-family:'Playfair Display',serif; font-size:26px; font-weight:700; margin-bottom:6px; }
  .done-sub { color:var(--muted); font-size:14px; margin-bottom:28px; line-height:1.5; }
  .done-stats { display:flex; gap:12px; justify-content:center; margin-bottom:28px; }
  .done-stat { background:var(--card-bg); border:1px solid var(--border); border-radius:12px; padding:14px 20px; }
  .done-stat-num { font-family:'Playfair Display',serif; font-size:30px; font-weight:700; color:var(--dark); }
  .done-stat-label { font-size:11px; color:var(--muted); }
  .categories { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:16px; }
  .cat-pill { font-size:10px; font-weight:500; padding:4px 11px; border-radius:20px; border:1.5px solid var(--border); background:var(--card-bg); color:var(--mid); cursor:pointer; transition:all 0.15s; user-select:none; }
  .cat-pill.active { background:var(--dark); color:var(--cream); border-color:var(--dark); }
  .progress-row { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .progress-bar { flex:1; height:4px; background:var(--border); border-radius:2px; overflow:hidden; }
  .progress-fill { height:100%; background:var(--red); border-radius:2px; transition:width 0.3s ease; }
  .progress-text { font-size:11px; color:var(--muted); white-space:nowrap; }
  .card-nav { display:flex; gap:10px; margin-top:14px; }
  .nav-btn { flex:1; padding:13px; border-radius:12px; border:1.5px solid var(--border); background:var(--card-bg); font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; color:var(--mid); cursor:pointer; transition:all 0.15s; display:flex; align-items:center; justify-content:center; gap:5px; }
  .nav-btn.primary { background:var(--dark); color:var(--cream); border-color:var(--dark); flex:2; }
  .score-panel { background:var(--card-bg); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:14px; display:flex; }
  .score-item { flex:1; text-align:center; border-right:1px solid var(--border); }
  .score-item:last-child { border-right:none; }
  .score-num { font-family:'Playfair Display',serif; font-size:28px; font-weight:700; color:var(--dark); line-height:1; margin-bottom:3px; }
  .score-label { font-size:10px; color:var(--muted); }
  .qtype-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; font-size:11px; color:var(--muted); }
  .qtype-toggle { display:flex; gap:6px; }
  .qtype-btn { padding:4px 12px; border-radius:20px; border:1.5px solid var(--border); background:var(--card-bg); font-size:11px; font-weight:500; color:var(--mid); cursor:pointer; }
  .qtype-btn.active { background:var(--dark); color:var(--cream); border-color:var(--dark); }
  .quiz-question-label { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:7px; text-align:center; }
  .quiz-word { font-family:'Playfair Display',serif; font-size:44px; font-weight:700; text-align:center; margin-bottom:5px; color:var(--dark); line-height:1.1; }
  .quiz-sub { font-size:12px; color:var(--muted); text-align:center; margin-bottom:6px; font-style:italic; }
  .quiz-audio-row { display:flex; justify-content:center; margin-bottom:20px; }
  .quiz-options { display:flex; flex-direction:column; gap:9px; margin-bottom:16px; }
  .option-btn { padding:14px 18px; border-radius:12px; border:1.5px solid var(--border); background:var(--card-bg); font-family:'DM Sans',sans-serif; font-size:14px; color:var(--dark); cursor:pointer; text-align:left; transition:all 0.15s; line-height:1.3; }
  .option-btn.correct { background:#EBF5EE; border-color:var(--correct); color:var(--correct); }
  .option-btn.wrong { background:#FDECEA; border-color:var(--wrong); color:var(--wrong); }
  .option-btn.locked { cursor:default; }
  .quiz-feedback { text-align:center; font-size:13px; font-weight:500; min-height:22px; margin-bottom:10px; }
  .quiz-feedback.correct-fb { color:var(--correct); }
  .quiz-feedback.wrong-fb { color:var(--wrong); }
  .quiz-next-btn { width:100%; padding:15px; border-radius:12px; background:var(--dark); color:var(--cream); border:none; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; cursor:pointer; display:none; }
  .quiz-next-btn.visible { display:block; }
  .result-screen { text-align:center; padding:36px 16px; }
  .result-emoji { font-size:56px; margin-bottom:14px; }
  .result-title { font-family:'Playfair Display',serif; font-size:26px; font-weight:700; margin-bottom:6px; }
  .result-subtitle { color:var(--muted); font-size:14px; margin-bottom:26px; }
  .result-stats { display:flex; gap:12px; justify-content:center; margin-bottom:26px; }
  .result-stat { background:var(--card-bg); border:1px solid var(--border); border-radius:12px; padding:14px 20px; text-align:center; }
  .result-stat-num { font-family:'Playfair Display',serif; font-size:32px; font-weight:700; color:var(--dark); }
  .result-stat-label { font-size:11px; color:var(--muted); }
  .restart-btn { width:100%; padding:15px; border-radius:12px; background:var(--dark); color:var(--cream); border:none; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; cursor:pointer; margin-bottom:8px; }
  .glossary-search { width:100%; padding:11px 14px; border-radius:12px; border:1.5px solid var(--border); background:var(--card-bg); font-family:'DM Sans',sans-serif; font-size:13px; color:var(--dark); margin-bottom:14px; outline:none; }
  .glossary-search:focus { border-color:var(--dark); }
  .glossary-group-label { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); padding:10px 0 6px; border-bottom:1px solid var(--border); margin-bottom:6px; }
  .glossary-item { display:flex; align-items:flex-start; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
  .g-word { font-family:'Playfair Display',serif; font-size:19px; font-weight:700; color:var(--dark); min-width:100px; line-height:1.2; }
  .g-details { flex:1; }
  .g-meaning { font-size:13px; font-weight:500; color:var(--dark); margin-bottom:2px; }
  .g-swedish { font-size:11px; color:var(--muted); }
  .g-srs-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:6px; }
  .g-audio-btn { width:32px; height:32px; border-radius:50%; background:var(--cream); border:1.5px solid var(--border); font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s; flex-shrink:0; }
  .g-audio-btn:active { background:var(--dark); color:var(--cream); }
  .dot-new { background:var(--srs-new); }
  .dot-learning { background:var(--srs-learn); }
  .dot-due { background:var(--srs-due); }
  .dot-known { background:var(--srs-ok); }
  .reset-link { font-size:11px; color:var(--muted); text-align:center; padding-top:16px; cursor:pointer; text-decoration:underline; }
  .quiz-audio-big { display:flex; flex-direction:column; align-items:center; margin:20px 0 24px; }
  .audio-btn-big { width:80px; height:80px; border-radius:50%; background:var(--dark); color:var(--cream); border:none; font-size:32px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform 0.1s, background 0.15s; box-shadow:0 4px 16px rgba(0,0,0,0.15); }
  .audio-btn-big:active { transform:scale(0.92); background:var(--red); }
  .audio-btn-big.speaking { background:var(--red); animation:pulse 0.6s infinite alternate; }
  .quiz-audio-hint { font-size:11px; color:var(--muted); margin-top:10px; letter-spacing:0.3px; }
  .quiz-word-reveal { margin-top:8px; padding-top:8px; border-top:1px solid rgba(0,0,0,0.08); }
  .qwr-da { font-family:'Playfair Display',serif; font-size:22px; font-weight:700; color:var(--dark); margin-right:8px; }
  .qwr-ipa { font-size:12px; color:var(--muted); font-style:italic; }
  .sentence-word-badge { text-align:center; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-bottom:14px; }
  .sentence-word-badge strong { color:var(--dark); font-style:normal; }
  .sentence-reveal { background:var(--cream); border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin-bottom:12px; font-size:13px; color:var(--mid); line-height:1.5; }
  .sentence-reveal .da-text { font-family:"Playfair Display",serif; font-size:16px; color:var(--dark); margin-bottom:4px; }

  /* ─── HARD MODE ─── */
  .hard-dash { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:18px; }
  .hard-tile { background:var(--card-bg); border:1px solid var(--border); border-radius:10px; padding:10px 6px; text-align:center; }
  .hard-tile-num { font-family:'Playfair Display',serif; font-size:22px; font-weight:700; line-height:1; }
  .hard-tile-label { font-size:10px; color:var(--muted); margin-top:3px; }
  .hard-tile.new .hard-tile-num { color:var(--srs-new); }
  .hard-tile.learning .hard-tile-num { color:var(--srs-learn); }
  .hard-tile.due .hard-tile-num { color:var(--srs-due); }
  .hard-tile.known .hard-tile-num { color:var(--srs-ok); }
  .hard-card { background:var(--card-bg); border:1px solid var(--border); border-radius:16px; padding:28px 22px; text-align:center; min-height:180px; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 2px 12px rgba(0,0,0,0.06); position:relative; margin-bottom:16px; }
  .hard-card-badge { position:absolute; top:12px; right:14px; font-size:9px; letter-spacing:1.5px; text-transform:uppercase; padding:3px 8px; border-radius:20px; font-weight:600; }
  .hard-card-count { position:absolute; top:12px; left:14px; font-size:11px; color:var(--muted); }
  .hard-focus { font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-bottom:14px; }
  .hard-reveal { width:100%; border-top:1px solid var(--border); padding-top:16px; margin-top:12px; display:none; }
  .hard-reveal.shown { display:block; }
  .hard-da { font-family:'Playfair Display',serif; font-size:18px; color:var(--dark); margin-bottom:8px; line-height:1.4; }
  .hard-sv { font-size:14px; color:var(--mid); margin-bottom:10px; }
  .hard-note { font-size:11px; color:var(--muted); font-style:italic; background:var(--cream); border-radius:8px; padding:7px 10px; text-align:left; }
  .hard-tap-hint { font-size:11px; color:var(--muted); margin-top:10px; }
  .hard-ratings { display:flex; gap:8px; margin-top:14px; }
  /* ─── GLOSSARY ─── */
  .gloss-search { width:100%; padding:11px 14px; border-radius:12px; border:1.5px solid var(--border); background:var(--card-bg); font-family:'DM Sans',sans-serif; font-size:13px; color:var(--dark); margin-bottom:14px; outline:none; }
  .gloss-search:focus { border-color:var(--dark); }
  .gloss-group-label { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); padding:10px 0 6px; border-bottom:1px solid var(--border); margin-bottom:6px; }
  .gloss-item { padding:12px 0; border-bottom:1px solid var(--border); }
  .gloss-item:last-child { border-bottom:none; }
  .gloss-da { font-family:'Playfair Display',serif; font-size:17px; color:var(--dark); margin-bottom:3px; line-height:1.3; }
  .gloss-sv { font-size:13px; color:var(--mid); margin-bottom:3px; }
  .gloss-focus { font-size:11px; color:var(--muted); font-style:italic; }
  .gloss-row { display:flex; align-items:flex-start; gap:8px; }
  .gloss-audio { flex-shrink:0; width:32px; height:32px; border-radius:50%; background:var(--cream); border:1.5px solid var(--border); font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s; margin-top:2px; }
  .gloss-audio:active { background:var(--dark); color:var(--cream); }
  .gloss-srs { width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:6px; }
  .dot-new { background:var(--srs-new); }
  .dot-learning { background:var(--srs-learn); }
  .dot-due { background:var(--srs-due); }
  .dot-known { background:var(--srs-ok); }
</style>

</head>
<body>
<div class="header">
  <div>
    <div class="header-title">Svensk <span>Øvelse</span></div>
    <div class="header-sub">Dansk → Svensk · v1.2</div>
  </div>
  <div class="streak-badge" id="streakBadge">🔥 0</div>
</div>
<div class="tabs">
  <div class="tab active"  onclick="switchTab('sentence')">Sætninger</div>
  <div class="tab"         onclick="switchTab('hard')">Sætninger Svær</div>
  <div class="tab"         onclick="switchTab('glossary')">Ordliste</div>
</div>

<!-- ════════════ SENTENCE QUIZ (multiple choice) -->
<div class="screen active" id="screen-sentence">
  <div class="score-panel">
    <div class="score-item"><div class="score-num" id="sqCorrect">0</div><div class="score-label">Rigtigt</div></div>
    <div class="score-item"><div class="score-num" id="sqWrong">0</div><div class="score-label">Forkert</div></div>
    <div class="score-item"><div class="score-num" id="sqLeft">0</div><div class="score-label">Tilbage</div></div>
  </div>
  <div id="sentenceArea">
    <div class="quiz-question-label">Hvad betyder den sætning du hører?</div>
    <div class="quiz-audio-big">
      <button class="audio-btn-big" id="sentenceAudioBtn" onclick="speakSentence()">🔊</button>
      <div class="quiz-audio-hint">Tryk for at høre igen</div>
    </div>
    <div class="sentence-word-badge" id="sentenceWordBadge"></div>
    <div class="quiz-options" id="sentenceOptions"></div>
    <div class="quiz-feedback" id="sentenceFeedback"></div>
    <div class="sentence-reveal" id="sentenceReveal" style="display:none"></div>
    <button class="quiz-next-btn" id="sentenceNextBtn" onclick="nextSentenceQ()">Næste sætning →</button>
  </div>
  <div id="sentenceResult" style="display:none">
    <div class="result-screen">
      <div class="result-emoji" id="sResultEmoji">🎉</div>
      <div class="result-title" id="sResultTitle">Bra jobbat!</div>
      <div class="result-subtitle" id="sResultSubtitle"></div>
      <div class="result-stats">
        <div class="result-stat"><div class="result-stat-num" id="srCorrect">—</div><div class="result-stat-label">Rigtigt</div></div>
        <div class="result-stat"><div class="result-stat-num" id="srPct">—</div><div class="result-stat-label">Procent</div></div>
      </div>
      <button class="restart-btn" onclick="startSentenceQuiz()">Spil igen →</button>
    </div>
  </div>
</div>

const HARD_SRS_KEY = "svensk_hard_v1";
let hardSRSData = {};
function loadHardSRS(){ try{ hardSRSData=JSON.parse(localStorage.getItem(HARD_SRS_KEY))||{}; }catch(e){ hardSRSData={}; } }
function saveHardSRS(){ try{ localStorage.setItem(HARD_SRS_KEY,JSON.stringify(hardSRSData)); }catch(e){} }
function getHardCard(key){
  if(!hardSRSData[key]) hardSRSData[key]={interval:0,reps:0,ef:2.5,nextDue:0,lapses:0};
  return hardSRSData[key];
}
function rateHardCard(key,rating){
  const c=getHardCard(key),now=Date.now(),DAY=86400000;
  if(rating===0){c.reps=0;c.interval=1;c.lapses++;c.nextDue=now+DAY;}
  else{
    const q=[null,3,4,5][rating];
    c.ef=Math.max(1.3,c.ef+0.1-(5-q)*(0.08+(5-q)*0.02));
    if(c.reps===0)c.interval=1;
    else if(c.reps===1)c.interval=4;
    else c.interval=Math.round(c.interval*c.ef);
    if(rating===3)c.interval=Math.round(c.interval*1.3);
    if(rating===1)c.interval=Math.max(1,Math.round(c.interval*0.6));
    c.reps++;c.nextDue=now+c.interval*DAY;
  }
  saveHardSRS();
}
function getHardIntervalLabel(key,rating){
  const c=getHardCard(key);
  if(rating===0)return"1d";
  const q=[null,3,4,5][rating];
  const ef=Math.max(1.3,c.ef+0.1-(5-q)*(0.08+(5-q)*0.02));
  let interval;
  if(c.reps===0)interval=1;
  else if(c.reps===1)interval=4;
  else interval=Math.round(c.interval*ef);
  if(rating===3)interval=Math.round(interval*1.3);
  if(rating===1)interval=Math.max(1,Math.round(interval*0.6));
  if(interval<7)return interval+"d";
  if(interval<30)return Math.round(interval/7)+"v";
  return Math.round(interval/30)+"mån";
}
function getHardStatus(key){
  const c=getHardCard(key),now=Date.now();
  if(c.reps===0&&c.nextDue===0)return"new";
  if(c.nextDue<=now)return c.reps<3?"learning":"due";
  return"known";
}
function getHardDueCounts(){
  let n=0,l=0,d=0,k=0;
  SENTENCES.forEach(s=>{
    const st=getHardStatus(s.da);
    if(st==="new")n++;else if(st==="learning")l++;else if(st==="due")d++;else k++;
  });
  return{new:n,learning:l,due:d,known:k};
}
function getHardDueQueue(limit){
  const now=Date.now();
  const nw=SENTENCES.filter(s=>getHardStatus(s.da)==="new").slice(0,5);
  const dw=SENTENCES.filter(s=>{const c=getHardCard(s.da);return c.nextDue<=now&&c.reps>=3;})
            .sort((a,b)=>getHardCard(a.da).nextDue-getHardCard(b.da).nextDue);
  const lw=SENTENCES.filter(s=>{const c=getHardCard(s.da);return c.nextDue<=now&&c.reps>0&&c.reps<3;});
  return[...lw,...dw,...nw].slice(0,limit||15).sort(()=>Math.random()-0.3);
}

  "Kan du hente børnene fra skole?": "audio/da/sentences/kan_du_hente_børnene_fra_skole.mp3",
  "Det er sært at han ikke har ringet": "audio/da/sentences/det_er_sært_at_han_ikke_har_ringet.mp3"
};

let _currentAudio = null;

function playAudio(path, btnId, fallbackText, fallbackLang) {
  if (_currentAudio) { _currentAudio.pause(); _currentAudio = null; }
  document.querySelectorAll('.speaking').forEach(b => b.classList.remove('speaking'));
  const btn = btnId ? document.getElementById(btnId) : null;
  if (btn) btn.classList.add('speaking');
  const audio = new Audio(path);
  _currentAudio = audio;
  audio.playbackRate = 0.92;
  const cleanup = () => {
    if (btn) btn.classList.remove('speaking');
    if (_currentAudio === audio) _currentAudio = null;
  };
  audio.addEventListener('ended', cleanup);
  audio.addEventListener('error', () => { cleanup(); speakTTS(fallbackText, fallbackLang, btnId); });
  audio.play().catch(() => { cleanup(); speakTTS(fallbackText, fallbackLang, btnId); });
}

function speakTTS(text, lang, btnId) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = lang; utt.rate = 0.82;
  const voices = window.speechSynthesis.getVoices();
  const v = voices.find(x => x.lang.startsWith(lang.slice(0, 2)));
  if (v) utt.voice = v;
  if (btnId) {
    const btn = document.getElementById(btnId);
    if (btn) btn.classList.add('speaking');
    utt.onend = utt.onerror = () => {
      const b = document.getElementById(btnId);
      if (b) b.classList.remove('speaking');
    };
  }
  window.speechSynthesis.speak(utt);
}

function speak(text, lang, btnId) {
  const path = AUDIO_MAP[text];
  if (path) { playAudio(path, btnId, text, lang); }
  else { speakTTS(text, lang, btnId); }
}

// ─── TABS ──────────────────────────────────────────────────────
function switchTab(tab){
  ["sentence","hard","glossary"].forEach((t,i)=>{
    document.querySelectorAll(".tab")[i].classList.toggle("active",t===tab);
    document.getElementById("screen-"+t).classList.toggle("active",t===tab);
  });
  if(tab==="sentence"&&sentenceWords.length===0)startSentenceQuiz();
  if(tab==="hard")renderHardDash();
  if(tab==="glossary")renderGlossary();
}

// ─── SENTENCE QUIZ (multiple choice) ───────────────────────────
function startSentenceQuiz(){
  sentenceWords=[...SENTENCES].sort(()=>Math.random()-0.5).slice(0,15);
  sentenceIndex=0;sentenceCorrect=0;sentenceWrong=0;sentenceAnswered=false;
  document.getElementById("sentenceArea").style.display="";
  document.getElementById("sentenceResult").style.display="none";
  updateSentenceScore();renderSentenceQ();
}
function updateSentenceScore(){
  document.getElementById("sqCorrect").textContent=sentenceCorrect;
  document.getElementById("sqWrong").textContent=sentenceWrong;
  document.getElementById("sqLeft").textContent=sentenceWords.length-sentenceIndex;
}
function speakSentence(){const s=sentenceWords[sentenceIndex];if(s)speak(s.sv,"sv-SE","sentenceAudioBtn");}
function renderSentenceQ(){
  if(sentenceIndex>=sentenceWords.length){showSentenceResult();return;}
  const s=sentenceWords[sentenceIndex];sentenceAnswered=false;
  document.getElementById("sentenceFeedback").textContent="";
  document.getElementById("sentenceFeedback").className="quiz-feedback";
  document.getElementById("sentenceNextBtn").classList.remove("visible");
  document.getElementById("sentenceReveal").style.display="none";
  document.getElementById("sentenceAudioBtn").classList.remove("speaking");
  document.getElementById("sentenceWordBadge").innerHTML="";
  const correct=s.da;
  const pool=SENTENCES.filter(x=>x.da!==s.da);
  const dist=pool.sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.da);
  const opts=[...dist,correct].sort(()=>Math.random()-0.5);
  document.getElementById("sentenceOptions").innerHTML=opts.map(opt=>`<button class="option-btn" onclick="answerSentence(this,'${escQ(opt)}','${escQ(correct)}','${escQ(s.sv)}')">${opt}</button>`).join("");
  updateSentenceScore();
  setTimeout(()=>speak(s.sv,"sv-SE","sentenceAudioBtn"),400);
}
function answerSentence(btn,chosen,correct,da){
  if(sentenceAnswered)return;sentenceAnswered=true;
  const s=sentenceWords[sentenceIndex];
  document.getElementById("sentenceWordBadge").innerHTML="Fokusord: <strong>"+s.word+"</strong>";
  document.querySelectorAll("#sentenceOptions .option-btn").forEach(b=>b.classList.add("locked"));
  const rev=document.getElementById("sentenceReveal");
  rev.innerHTML=`<div class="da-text">🇸🇪 ${da}</div><div>🇩🇰 ${correct}</div>`;
  rev.style.display="";
  if(chosen===correct){btn.classList.add("correct");sentenceCorrect++;streak++;document.getElementById("sentenceFeedback").textContent="✓ Rigtigt!";document.getElementById("sentenceFeedback").className="quiz-feedback correct-fb";}
  else{btn.classList.add("wrong");streak=0;sentenceWrong++;document.querySelectorAll("#sentenceOptions .option-btn").forEach(b=>{if(b.textContent.trim()===correct)b.classList.add("correct");});document.getElementById("sentenceFeedback").textContent="✗ Forkert!";document.getElementById("sentenceFeedback").className="quiz-feedback wrong-fb";}
  document.getElementById("streakBadge").textContent="🔥 "+streak;
  document.getElementById("sentenceNextBtn").classList.add("visible");updateSentenceScore();sentenceIndex++;
}
function nextSentenceQ(){renderSentenceQ();}
function showSentenceResult(){
  document.getElementById("sentenceArea").style.display="none";document.getElementById("sentenceResult").style.display="";
  const pct=Math.round((sentenceCorrect/sentenceWords.length)*100);
  document.getElementById("srCorrect").textContent=sentenceCorrect+"/"+sentenceWords.length;
  document.getElementById("srPct").textContent=pct+"%";
  let emoji="😐",title="Ikke dårligt",sub="Bliv ved med at øve!";
  if(pct>=90){emoji="🏆";title="Fremragende!";sub="Du forstår svenske sætninger!";}
  else if(pct>=75){emoji="🎉";title="Godt arbejde!";sub="Konteksten begynder at give sig.";}
  else if(pct>=50){emoji="📚";title="På god vej";sub="Lyt aktivt efter reduktioner.";}
  else{emoji="💪";title="Bliv ved!";sub="Sætningerne er svære – men det betaler sig.";}
  document.getElementById("sResultEmoji").textContent=emoji;
  document.getElementById("sResultTitle").textContent=title;
  document.getElementById("sResultSubtitle").textContent=sub;
}

// ─── HARD MODE (SM-2 self-rate) ─────────────────────────────────
function renderHardDash(){
  const c=getHardDueCounts();
  document.getElementById("hardDash").innerHTML=`
    <div class="hard-tile new"><div class="hard-tile-num">${c.new}</div><div class="hard-tile-label">Nya</div></div>
    <div class="hard-tile learning"><div class="hard-tile-num">${c.learning}</div><div class="hard-tile-label">Lär</div></div>
    <div class="hard-tile due"><div class="hard-tile-num">${c.due}</div><div class="hard-tile-label">Repetition</div></div>
    <div class="hard-tile known"><div class="hard-tile-num">${c.known}</div><div class="hard-tile-label">Kan</div></div>`;
}
function renderHardStudy(){
  const area=document.getElementById("hardStudyArea");
  if(hardQIndex>=hardQueue.length){
    renderHardDash();
    const c=getHardDueCounts();
    const total=c.new+c.learning+c.due;
    if(hardSessionTotal===0&&total===0){
      area.innerHTML=`<div class="done-panel"><div class="done-emoji">🎉</div><div class="done-title">Alt klart!</div><div class="done-sub">Ingen sætninger at gentage i dag.<br>Kom tilbage i morgen!</div><div class="done-stats"><div class="done-stat"><div class="done-stat-num">${SENTENCES.filter(s=>getHardStatus(s.da)==="known").length}</div><div class="done-stat-label">Kända</div></div><div class="done-stat"><div class="done-stat-num">${SENTENCES.length}</div><div class="done-stat-label">Totalt</div></div></div><div class="reset-link" onclick="resetHardSRS()">Nulstil fremskridt</div></div>`;
      return;
    }
    area.innerHTML=`<div class="done-panel"><div class="done-emoji">✅</div><div class="done-title">Session færdig!</div><div class="done-sub">${total>0?`${total} sætninger tilbage at øve.`:"Alt gentaget for nu!"}</div><div class="done-stats"><div class="done-stat"><div class="done-stat-num">${hardSessionCorrect}</div><div class="done-stat-label">Bra svar</div></div><div class="done-stat"><div class="done-stat-num">${hardSessionTotal}</div><div class="done-stat-label">Totalt</div></div></div>${total>0?`<button class="restart-btn" onclick="startHardSession()">Fortsæt →</button>`:""}<div class="reset-link" onclick="resetHardSRS()">Nulstil fremskridt</div></div>`;
    return;
  }
  const s=hardQueue[hardQIndex];
  const st=getHardStatus(s.da);
  const bmap={new:"badge-new",learning:"badge-review",due:"badge-due",known:"badge-due"};
  const blbl={new:"Nyt",learning:"Lær",due:"Gentagelse",known:"Gentagelse"};
  hardRevealed=false;
  area.innerHTML=`
    <div class="hard-card" id="hardCard" onclick="revealHard()">
      <div class="hard-card-badge ${bmap[st]}">${blbl[st]}</div>
      <div class="hard-card-count">${hardQIndex+1} / ${hardQueue.length}</div>
      <button class="audio-btn" id="hardAudioBtn" onclick="event.stopPropagation();speak('${escQ(s.sv)}','sv-SE','hardAudioBtn')">🔊</button>
      <div class="hard-tap-hint" id="hardTapHint">Tryk for at se oversættelse</div>
      <div class="hard-reveal" id="hardReveal">
        <div class="hard-da">🇸🇪 ${s.sv}</div>
        <div class="hard-sv">🇩🇰 ${s.da}</div>
        ${s.word?`<div class="hard-note">Fokusord: ${s.word}</div>`:""}
      </div>
    </div>
    <div id="hardRatings" style="display:none">
      <div class="hard-ratings">
        <button class="rating-btn r-again" onclick="rateHard(0)"><span class="r-emoji">😬</span><span class="r-label">Igen</span><span class="r-interval">${getHardIntervalLabel(s.da,0)}</span></button>
        <button class="rating-btn r-hard" onclick="rateHard(1)"><span class="r-emoji">😅</span><span class="r-label">Svårt</span><span class="r-interval">${getHardIntervalLabel(s.da,1)}</span></button>
        <button class="rating-btn r-good" onclick="rateHard(2)"><span class="r-emoji">🙂</span><span class="r-label">Bra</span><span class="r-interval">${getHardIntervalLabel(s.da,2)}</span></button>
        <button class="rating-btn r-easy" onclick="rateHard(3)"><span class="r-emoji">😎</span><span class="r-label">Lätt</span><span class="r-interval">${getHardIntervalLabel(s.da,3)}</span></button>
      </div>
    </div>`;
  setTimeout(()=>speak(s.sv,"sv-SE","hardAudioBtn"),400);
}
function revealHard(){
  if(hardRevealed)return;
  hardRevealed=true;
  document.getElementById("hardReveal").classList.add("shown");
  document.getElementById("hardTapHint").style.display="none";
  document.getElementById("hardRatings").style.display="";
}
function rateHard(rating){
  const s=hardQueue[hardQIndex];
  rateHardCard(s.da,rating);
  hardSessionTotal++;
  if(rating>=2){hardSessionCorrect++;streak++;}else{streak=0;}
  document.getElementById("streakBadge").textContent="🔥 "+streak;
  hardQIndex++;renderHardStudy();
}
function startHardSession(){
  hardQueue=getHardDueQueue(15);
  hardQIndex=0;hardSessionCorrect=0;hardSessionTotal=0;
  renderHardDash();renderHardStudy();
}
function resetHardSRS(){
  if(confirm("Nulstille alle fremskridt for svær tilstand?")){
    hardSRSData={};saveHardSRS();
    hardQueue=[];hardQIndex=0;hardSessionCorrect=0;hardSessionTotal=0;
    startHardSession();
  }
}

// ─── GLOSSARY ───────────────────────────────────────────────────
function renderGlossary(){
  const q=document.getElementById("glossSearch").value.toLowerCase();
  const filtered=SENTENCES.filter(s=>
    s.da.toLowerCase().includes(q)||
    s.sv.toLowerCase().includes(q)||
    (s.word&&s.word.toLowerCase().includes(q))
  );
  const container=document.getElementById("glossList");
  if(!filtered.length){container.innerHTML='<p style="color:var(--muted);padding:20px 0;text-align:center">Inga meningar hittades.</p>';return;}
  const dc={new:"dot-new",learning:"dot-learning",due:"dot-due",known:"dot-known"};
  container.innerHTML=filtered.map(s=>`
    <div class="gloss-item">
      <div class="gloss-row">
        <div style="flex:1">
          <div class="gloss-da">${s.da}</div>
          <div class="gloss-sv">${s.sv}</div>
          ${s.word?`<div class="gloss-focus">🎯 ${s.word}</div>`:""}
        </div>
        <div class="gloss-srs ${dc[getHardStatus(s.da)]}"></div>
        <button class="gloss-audio" onclick="speak('${escQ(s.sv)}','sv-SE')">🔊</button>
      </div>
    </div>`).join("");
}

// ─── HELPERS ────────────────────────────────────────────────────
function escQ(s){return s.replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"&quot;");}

// ─── INIT ────────────────────────────────────────────────────────
window.onload=()=>{
  loadHardSRS();
  startSentenceQuiz();
  renderGlossary();
  initVoices();
};
</script>
